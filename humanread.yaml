title: Romance of the Three Kingdoms
slug: romance-of-the-three-kingdoms-52e790
summary: A complete and faithful English translation of Luo Guanzhong’s Romance of
  the Three Kingdoms, based on the public-domain Mao Lun and Mao Zonggang recension.
  Across all 120 chapters, the fall of the Han gives rise to rival kingdoms, divided
  loyalties, brilliant strategists, and heroes whose ambitions reshape China.
